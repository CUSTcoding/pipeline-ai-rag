[project]
name = "sunrise-backend"
version = "0.1.0"
description = "Agente de apoio a vítimas de violência sexual e doméstica (Moçambique)"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.11.0",
    "qdrant-client>=1.12.1",
    "sentence-transformers>=3.3.1",
    "pypdf>=5.1.0",
    "rank-bm25>=0.2.2",
    "langgraph>=0.2.60",
    "python-dotenv>=1.0.1",
    "nltk>=3.9.1",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
]

[tool.setuptools.packages.find]
include = ["rag*"]
